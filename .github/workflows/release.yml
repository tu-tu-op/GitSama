name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: "gitsama-${{ github.ref_name }}-windows-x86_64.zip"
            raw_asset: "gitsama-${{ github.ref_name }}-windows-x86_64.exe"
            binary: gitsama.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: "gitsama-${{ github.ref_name }}-linux-x86_64.tar.gz"
            raw_asset: "gitsama-${{ github.ref_name }}-linux-x86_64"
            binary: gitsama
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: "gitsama-${{ github.ref_name }}-macos-x86_64.tar.gz"
            raw_asset: "gitsama-${{ github.ref_name }}-macos-x86_64"
            binary: gitsama
          - os: macos-14
            target: aarch64-apple-darwin
            asset: "gitsama-${{ github.ref_name }}-macos-aarch64.tar.gz"
            raw_asset: "gitsama-${{ github.ref_name }}-macos-aarch64"
            binary: gitsama

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js for package version validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify release tag matches package versions
        shell: bash
        run: |
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1 | tr -d '\r')"
          npm_version="$(node -p "require('./npm/package.json').version")"
          test "$GITHUB_REF_NAME" = "v$cargo_version"
          test "$cargo_version" = "$npm_version"
          test "$(sed -n 's/^\$version = "\([^"]*\)"/\1/p' install.ps1 | tr -d '\r')" = "$cargo_version"
          test "$(sed -n 's/^VERSION="${GITSAMA_VERSION:-\([^}]*\)}"/\1/p' install.sh)" = "$cargo_version"

      - name: Require the release commit to be merged into main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install Linux audio build dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Verify source before building release assets
        env:
          GITSAMA_REQUIRE_GIT_254: "1"
        run: cargo test --locked --all-features

      - name: Verify npm installer and upgrade guards
        working-directory: npm
        run: npm test

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASSET: ${{ matrix.asset }}
          RAW_ASSET: ${{ matrix.raw_asset }}
          BINARY: ${{ matrix.binary }}
          TARGET: ${{ matrix.target }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "gitsama-staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath "target\$env:TARGET\release\$env:BINARY" -Destination (Join-Path $staging $env:BINARY)
          Compress-Archive -Path (Join-Path $staging $env:BINARY) -DestinationPath $env:ASSET
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:ASSET).Hash.ToLower()
          "$hash  $env:ASSET" | Out-File -Encoding ascii "$env:ASSET.sha256"
          Copy-Item -LiteralPath (Join-Path $staging $env:BINARY) -Destination $env:RAW_ASSET
          $binaryHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:RAW_ASSET).Hash.ToLower()
          "$binaryHash  $env:RAW_ASSET" | Out-File -Encoding ascii "$env:RAW_ASSET.sha256"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        env:
          ASSET: ${{ matrix.asset }}
          RAW_ASSET: ${{ matrix.raw_asset }}
          TARGET: ${{ matrix.target }}
        run: |
          staging="$RUNNER_TEMP/gitsama-staging"
          mkdir -p "$staging"
          cp "target/$TARGET/release/gitsama" "$staging/gitsama"
          tar -czf "$ASSET" -C "$staging" gitsama
          cp "$staging/gitsama" "$RAW_ASSET"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" > "$ASSET.sha256"
            sha256sum "$RAW_ASSET" > "$RAW_ASSET.sha256"
          else
            shasum -a 256 "$ASSET" > "$ASSET.sha256"
            shasum -a 256 "$RAW_ASSET" > "$RAW_ASSET.sha256"
          fi

      - name: Upload packaged artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            ${{ matrix.raw_asset }}
            ${{ matrix.raw_asset }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Attest the built release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release-assets/*

      - name: Upload the complete release as a draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          files: release-assets/*

      - name: Publish the completed draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  publish-npm:
    name: Publish npm package
    if: vars.NPM_TRUSTED_PUBLISHING == 'true'
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Node.js for trusted publishing
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.0

      - name: Download the binaries from this build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Pin the checked build digests in the npm package
        working-directory: npm
        run: npm run prepare-release -- ../release-assets

      - name: Publish after GitHub release binaries are available
        working-directory: npm
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          published="$(npm view "gitsama@$version" version --registry https://registry.npmjs.org 2>/dev/null || true)"
          if [ "$published" = "$version" ]; then
            echo "gitsama@$version is already published."
          else
            npm publish --provenance --access public --registry https://registry.npmjs.org
          fi
