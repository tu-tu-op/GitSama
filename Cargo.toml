[package]
name = "gitsama"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Anime reactions for your Git workflow"
license = "MIT"
repository = "https://github.com/tu-tu-op/GitSama"
homepage = "https://github.com/tu-tu-op/GitSama"
readme = "README.md"
keywords = ["git", "cli", "audio", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
dirs = "4.0.0"
rand = "0.10.0"
rodio = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
toml = "0.9.12"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
strip = true
lto = true
codegen-units = 1
