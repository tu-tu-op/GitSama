[package]
name = "gitsama"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Anime reactions for your Git workflow"
license = "MIT"
repository = "https://github.com/tu-tu-op/GitSama"
homepage = "https://github.com/tu-tu-op/GitSama"
readme = "README.md"
keywords = ["git", "cli", "audio", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
dirs = "4.0.0"
rand = "0.10.0"
rodio = "0.21.1"
self-replace = "1.5.0"
semver = "1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
tempfile = "3.20.0"
thiserror = "2.0.17"
toml = "1.1.6"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
